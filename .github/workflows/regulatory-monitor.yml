name: Regulatory Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regulatory-monitor.yml'
      - 'packages/regulatory-monitor/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @vida/regulatory-monitor build

      - name: Ensure monitor labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create regulatory-change --color D73A4A --description 'Authoritative regulatory source changed' --force
          gh label create regulatory-review --color FBCA04 --description 'Human regulatory review required' --force
          gh label create regulatory-monitor --color 5319E7 --description 'Regulatory monitor operational issue' --force

      - name: Prepare regulatory-state worktree
        run: |
          git fetch origin regulatory-state:refs/remotes/origin/regulatory-state || true
          if git show-ref --verify --quiet refs/remotes/origin/regulatory-state; then
            git worktree add /tmp/vida-regulatory-state refs/remotes/origin/regulatory-state
          else
            git worktree add -b regulatory-state /tmp/vida-regulatory-state HEAD
          fi
          mkdir -p /tmp/vida-regulatory-state/.regulatory-state

      - name: Check authoritative sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node packages/regulatory-monitor/dist/cli.js \
            --state-dir /tmp/vida-regulatory-state/.regulatory-state \
            --report /tmp/regulatory-monitor-report.json

      - name: Publish observation history
        run: |
          cd /tmp/vida-regulatory-state
          git config user.name 'vida-regulatory-bot'
          git config user.email 'vida-regulatory-bot@users.noreply.github.com'
          git add .regulatory-state
          if git diff --cached --quiet; then
            echo 'No state changes to publish.'
            exit 0
          fi
          git commit -m "chore(regulatory): record source observations $(date -u +%F)"
          git push origin HEAD:regulatory-state

      - name: Upload monitor report
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-monitor-report
          path: /tmp/regulatory-monitor-report.json
          retention-days: 30
